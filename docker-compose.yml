
services:
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env_docker
    depends_on:
      - db
 
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: django_auth_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_pass
 
volumes:
  postgres_data:
 