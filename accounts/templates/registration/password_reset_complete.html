{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card mt-5 shadow-sm">
                    <div class="card-header bg-white border-bottom-0 fw-semibold text-center">
                        Password Reset Complete
                    </div>
                    <div class="card-body">
                        <p>Your password has been set. You may go ahead and <a href="{% url 'account_login' %}">log in</a>.</p>
                        <a href="{% url 'account_login' %}" class="btn btn-primary w-100 mt-3">Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
