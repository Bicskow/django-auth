{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Set a New Password{% endblock %}

{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card mt-5 shadow-sm">
                    <div class="card-header bg-white border-bottom-0 fw-semibold text-center">
                        Set a New Password
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <button type="submit" class="btn btn-primary w-100 mb-2">Change password</button>
                            <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100">Back to login</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
