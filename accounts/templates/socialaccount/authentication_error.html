{% extends "base.html" %}

{% block title %}Login Failed{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card mt-5 shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
                    </div>
                    <h2 class="card-title mb-3">Login Failed</h2>
                    <p class="card-text text-muted mb-4">
                        An error occurred while trying to sign in with your Google account. Please try again or use email and password.
                    </p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary w-100">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
