{% extends "base.html" %}

{% block title %}Login Cancelled{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card mt-5 shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="bi bi-x-circle display-1 text-warning"></i>
                    </div>
                    <h2 class="card-title mb-3">Login Cancelled</h2>
                    <p class="card-text text-muted mb-4">
                        You decided to cancel signing in. If this was a mistake, please try again.
                    </p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary w-100">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
