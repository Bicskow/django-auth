{% extends "base.html" %}

{% block title %}Login Title{% endblock %}


{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card mt-5 shadow-sm">
                      <div class="card-header bg-white border-bottom-0 fw-semibold text-center">
                        Login
                      </div>
                        <div class="card-body">
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="userName" class="form-label">User Name</label>
                                    <input type="text" class="form-control" id="userName" name="username">
                                </div>
                                <div class="mb-3">
                                    <label for="inputPassw" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="inputPassw" name="password">
                                </div>
                                <button type="submit" class="btn btn-primary w-100 mb-5">Submit</button>
                                <a class="btn btn-outline-primary w-100 mb-5" href="{% url 'registration' %}">Registration</a>
                                <a class="btn btn-outline-secondary w-100" href="{% url 'password_reset' %}">Forgot your password?</a>
                            </form>
                        </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
