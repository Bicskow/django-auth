<!DOCTYPE html>
<header>
    <title>
        Login
    </title>
</header>
<body>
    <h1>Login</h1>
    {% if error%}
        <p>{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="User name"/>
        <input type="password" name="password" placeholder="Password"/>
        <button type="submit">Login</button>
    </form>
    <a href="{% url 'registration' %}">Registration</a>
</body>
</html>
