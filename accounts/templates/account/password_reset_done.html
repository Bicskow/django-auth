{% extends "base.html" %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card mt-5 shadow-sm">
                    <div class="card-header bg-white border-bottom-0 fw-semibold text-center">
                        Password Reset Sent
                    </div>
                    <div class="card-body">
                        <p>We've emailed you instructions for setting your password. If they don't appear shortly, check your spam folder.</p>
                        <a href="{% url 'account_login' %}" class="btn btn-outline-primary w-100 mt-3">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
