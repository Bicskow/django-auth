name: PR Test Command

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SECRET_KEY: test-secret-key-for-ci
          MAILGUN_API_KEY: test
          MAILGUN_DOMAIN: test.com
          DEFAULT_FROM_EMAIL: test@test.com
        run: |
          pytest --cov=accounts --cov=common --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Django Auth Test Results
          path: test-results.xml
          reporter: java-junit

      - name: Add coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
